[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "my-time-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi[standard]>=0.115,<1", "sqlalchemy>=2.0,<3", "alembic>=1.13,<2", "argon2-cffi>=23,<26", "pydantic-settings>=2,<3", "psycopg[binary]>=3.2,<4", "Pillow>=12,<13", "httpx>=0.27,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
